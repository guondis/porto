        /* Glassmorphism Effect */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Button Hover */
        .btn-glass {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>

        function getYouTubeVideoId(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/ ]{11})/i;
            const match = url.match(regex);
            return (match && match[1]) ? match[1] : null;
        }

        function createContentElement(item) {
            const card = document.createElement('div');
            card.className = "glass p-4 rounded-2xl shadow-lg hover:scale-105 transform transition duration-300 flex flex-col";

            let content;
            const youTubeId = getYouTubeVideoId(item.link);
            const isMp4 = item.link.endsWith('.mp4');
            const isDriveVideoFile = item.link.includes('drive.google.com/file/');

            if (youTubeId) {
                content = document.createElement('iframe');
                content.className = "w-full h-48 rounded-lg mb-4";
                content.src = `https://www.youtube.com/embed/${youTubeId}`;
                content.setAttribute("frameborder", "0");
                content.setAttribute("allowfullscreen", "");
            } else if (isMp4) {
                content = document.createElement('video');
                content.className = "w-full h-48 rounded-lg object-cover mb-4";
                content.src = item.link;
                content.controls = true;
            } else if (isDriveVideoFile) {
                const driveEmbedUrl = item.link.replace('/view?usp=drive_link', '/preview').replace('/view?usp=sharing', '/preview');
                content = document.createElement('iframe');
                content.className = "w-full h-48 rounded-lg mb-4";
                content.src = driveEmbedUrl;
                content.setAttribute("frameborder", "0");
                content.setAttribute("allowfullscreen", "");
            } else {
                content = document.createElement('div');
                content.className = "w-full h-48 flex items-center justify-center text-white/70 text-sm italic bg-white/10 rounded-lg mb-4";
                content.textContent = "Pratinjau tidak tersedia.";
            }

            const title = document.createElement('h2');
            title.className = "text-lg font-semibold mb-2";
            title.textContent = item.label;

            const linkElement = document.createElement('a');
            linkElement.className = "text-sm text-white/90 hover:text-white underline mt-auto font-medium";
            linkElement.href = item.link;
            linkElement.target = "_blank";
            linkElement.rel = "noopener noreferrer";
            linkElement.textContent = "Lihat Konten →";

            card.appendChild(content);
            card.appendChild(title);
            card.appendChild(linkElement);

            return card;
        }

        window.onload = function() {
            const contentGrid = document.getElementById('content-grid');
            for (const category in contentData) {
                const categoryTitle = document.createElement('h2');
                categoryTitle.className = "col-span-full text-2xl font-bold mb-2 drop-shadow-lg";
                categoryTitle.textContent = category;
                contentGrid.appendChild(categoryTitle);

                contentData[category].forEach(item => {
                    const contentElement = createContentElement(item);
                    contentGrid.appendChild(contentElement);
                });
            }
        };

        document.getElementById('toggleDarkMode').addEventListener('click', () => {
