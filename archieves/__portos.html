        tailwind.config = {

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .glass {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Overlay Pop-up Putih Transparan 80% */
        #video-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85); /* Putih transparan sedikit lebih pekat */
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .popup-content {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 900px;
            position: relative;
            margin: 0 auto;
        }

        .thumbnail-container {
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        .thumbnail-container:hover .play-icon {
            opacity: 1;
            transform: scale(1.1);
        }

        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.8;
            transition: all 0.3s ease;
        }

        /* Tombol Tutup diperbaiki agar terlihat jelas */
        .close-btn {
            background: #f3f4f6;
            color: #1f2937;
            padding: 8px 16px;
            border-radius: 99px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: #ef4444;
            color: white;
            transform: translateY(-2px);
        }
        
        /* Default desktop / landscape */
        #video-container {
            aspect-ratio: 16 / 9;
            max-height: 80vh;
        }

        /* Mobile portrait */
        @media (max-width: 768px) and (orientation: portrait) {
            #video-container {
                aspect-ratio: 9 / 16;
                max-height: 90vh;
            }

            .popup-content {
                max-width: 95vw;
            }
        }
        .section-title {
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 0.04em;

            /* Outline tipis */
            -webkit-text-stroke: 1.2px rgba(0, 0, 0, 0.7);

            /* Shadow halus */
            text-shadow: 0 3px 10px rgba(0,0,0,.6);
        }


    </style>

        const overlay = document.getElementById('video-overlay');

        const audioBtn = document.getElementById('safari-audio-btn');

        function getYouTubeVideoId(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/ ]{11})/i;
            const match = url.match(regex);
            return (match && match[1]) ? match[1] : null;
        }

        function createContentElement(item) {
          const card = document.createElement('div');
          card.className = "glass p-4 rounded-2xl shadow-lg hover:scale-105 transform transition duration-300 flex flex-col";

          const thumb = document.createElement('div');
          thumb.className = "thumbnail-container w-full h-48 rounded-lg mb-4 relative overflow-hidden";

          thumb.innerHTML = `
            <img 
              src="${item.image}" 
              alt="${item.label}"
              class="w-full h-full object-cover"
            />
            <div class="absolute inset-0 bg-gradient-to-tr from-blue-900/30 to-purple-900/30"></div>
            <div class="play-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="54" height="54" viewBox="0 0 24 24" fill="white">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
            </div>
          `;

          thumb.onclick = () => openOverlay(item);

          const title = document.createElement('h2');
          title.className = "text-lg font-semibold mb-2";
          title.textContent = item.label;

          card.appendChild(thumb);
          card.appendChild(title);
          return card;
        }

        function openOverlay(item) {
            videoContainer.innerHTML = '';
            overlay.style.display = 'flex';
            audioBtn.classList.add('hidden');
            document.body.style.overflow = 'hidden';
            
            document.getElementById('video-title').textContent = item.label;

            const youTubeId = getYouTubeVideoId(item.link);
            const isMp4 = item.link.endsWith('.mp4');
            const isDriveFile = item.link.includes('drive.google.com/file/');

            if (youTubeId) {
                const iframe = document.createElement('iframe');
                iframe.className = "w-full h-full";
                iframe.src = `https://www.youtube.com/embed/${youTubeId}?autoplay=1&mute=0&rel=0`;
                iframe.setAttribute("allow", "autoplay; encrypted-media");
                iframe.setAttribute("allowfullscreen", "");
                videoContainer.appendChild(iframe);
            } else if (isMp4) {
                const video = document.createElement('video');
                video.id = "main-video";
                video.className = "w-full h-full object-contain";
                video.src = item.link;
                video.controls = true;
                video.autoplay = true;
                videoContainer.appendChild(video);

                video.play().catch(() => {
                    audioBtn.classList.remove('hidden');
                });
            } else if (isDriveFile) {
                const driveEmbedUrl = item.link.replace('/view?usp=drive_link', '/preview').replace('/view?usp=sharing', '/preview');
                const iframe = document.createElement('iframe');
                iframe.className = "w-full h-full";
                iframe.src = driveEmbedUrl;
                iframe.setAttribute("allow", "autoplay");
                videoContainer.appendChild(iframe);
            }
            overlay.style.display = 'flex';
            adjustVideoAspect();

        }

        function closeOverlay() {
            overlay.style.display = 'none';
            videoContainer.innerHTML = '';
            document.body.style.overflow = 'auto';
        }

        function enableAudio() {
            const video = document.getElementById('main-video');
            if (video) {
                video.muted = false;
                video.play();
                audioBtn.classList.add('hidden');
            }
        }

        window.onload = function() {
            const contentGrid = document.getElementById('content-grid');
            for (const category in contentData) {

            };

            const categoryTitle = document.createElement('div');
            categoryTitle.className = `
              col-span-full
              flex items-center
              mt-14 mb-6
              rounded-xl
              bg-black/60
              backdrop-blur
              shadow-lg
            `;

            categoryTitle.innerHTML = `
              <div class="w-2 h-full rounded-l-xl ${categoryColors[category] || 'bg-gray-500'}"></div>
              <h2 class="section-title px-5 py-4 text-xl sm:text-2xl">
                ${category}
              </h2>
            `;

            contentGrid.appendChild(categoryTitle);



                contentData[category].forEach(item => {
                    const contentElement = createContentElement(item);
                    contentGrid.appendChild(contentElement);
                });
            }
        };

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeOverlay();
        });

    <script>
function adjustVideoAspect() {
    const vc = document.getElementById('video-container');
    if (!vc) return;

    if (window.innerWidth < 768 && window.matchMedia("(orientation: portrait)").matches) {
        vc.style.aspectRatio = "9 / 16";
    } else {
        vc.style.aspectRatio = "16 / 9";
    }
}

window.addEventListener("resize", adjustVideoAspect);
window.addEventListener("orientationchange", adjustVideoAspect);
</script>
